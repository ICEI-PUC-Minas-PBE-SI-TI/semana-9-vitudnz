<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vitor Periféricos de Informática</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Vitor Periféricos de Informática</h1>

  <div>

    <input type="text"
           id="search"
           placeholder="Buscar produto">

    <select id="category">

      <option value="Todas">
        Todas
      </option>

    </select>

    <button id="btnRender">
      Atualizar
    </button>

  </div>

  <hr>

  <div id="product-list"></div>

  <hr>

  <div id="product-details">

    <h2>Detalhes do Produto</h2>

    <p>
      Clique em "Ver detalhes" para visualizar as informações do produto desejado.
    </p>

  </div>

  <script src="script.js"></script>

</body>

</html>
